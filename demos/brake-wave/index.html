<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Brake Wave — Traffic Shockwave Demo</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app"></div>

    <div id="ui">
      <h1>Brake Wave</h1>
      <p class="sub">
        A phantom jam: one hard brake ripples <em>backwards</em> through the lane even
        though nobody is blocking the road.
      </p>

      <div class="row">
        <button id="btn-brake" title="Space">Brake (pace car)</button>
        <button id="btn-pause" title="P">Pause</button>
        <button id="btn-reset" title="R">Reset</button>
      </div>

      <label class="slider">
        <span>Density <b id="density-val"></b></span>
        <input id="density" type="range" min="15" max="120" step="1" value="38" />
      </label>

      <label class="slider">
        <span>Reaction delay <b id="delay-val"></b></span>
        <input id="delay" type="range" min="0" max="1.6" step="0.05" value="0.7" />
      </label>

      <label class="slider">
        <span>Time scale <b id="time-val"></b></span>
        <input id="time-scale" type="range" min="0.1" max="3" step="0.1" value="1" />
      </label>

      <div class="row small">
        <label><input id="chk-trails" type="checkbox" checked /> Brake trails</label>
        <label><input id="chk-vectors" type="checkbox" checked /> Speed arrows</label>
      </div>

      <div id="stats">
        <div><span>Avg speed</span><b id="stat-speed">—</b></div>
        <div><span>Braking</span><b id="stat-braking">—</b></div>
        <div><span>Jam length</span><b id="stat-jam">—</b></div>
        <div><span>Wave speed</span><b id="stat-wave">—</b></div>
      </div>

      <div class="legend">
        <span class="sw" style="background:#35e46a"></span> cruising
        <span class="sw" style="background:#ffd23f"></span> easing
        <span class="sw" style="background:#ff3b30"></span> hard brake
      </div>

      <p class="keys">Keys: <kbd>Space</kbd> brake · <kbd>P</kbd> pause · <kbd>R</kbd> reset · drag to orbit · scroll to zoom</p>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
